name: CI

on:
  push:
    branches: [main, "ship/**", "fix/**", "pr/**", "scratch/**"]
  pull_request:
    branches: [main]

jobs:
  phase-a:
    name: Phase A gates
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      PYTHONPATH: ${{ github.workspace }}
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          mkdir -p "$DATA_DIR/logs"

      - name: make detect
        run: make detect

      - name: make test-unit
        run: make test-unit

      - name: make test-integration
        run: make test-integration

      - name: make test-e2e
        run: make test-e2e

      - name: make mutation-gate
        run: make mutation-gate

      - name: make compile-domain + generated tests
        run: |
          make compile-domain
          python -m pytest tests/generated/ -v

  phase-b-live-e2e:
    name: Phase B live E2E (spec 11.4 step 7)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx (checker dependency)
        run: pip install httpx

      - name: Generate stack credentials
        run: |
          {
            echo "HIVE_JWT_KEY=$(openssl rand -hex 32)"
            echo "AGENT_API_TOKEN=$(openssl rand -hex 32)"
            echo "AGENT_SECRET=$(openssl rand -hex 32)"
            echo "AGENT_ID=agent-e2e"
          } >> "$GITHUB_ENV"

      - name: Bring the stack up (hive + ollama + agent)
        run: docker compose up -d --wait --wait-timeout 900

      - name: Stage evidence inside the agent container
        run: |
          printf 'Container type: dry. Dwell hours: 24. Base rate: 10 USD/hr.\n' > tariff.txt
          docker compose exec -T agent-instance mkdir -p /data/evidence
          docker compose cp tariff.txt agent-instance:/data/evidence/tariff.txt

      - name: Run spec 11.4 step 7
        run: |
          python scripts/live_e2e_check.py \
            --base-url http://localhost:8000 \
            --token "$AGENT_API_TOKEN" \
            --evidence-path /data/evidence/tariff.txt \
            --timeout 600

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  phase-b-registered-skip:
    name: Phase B registered skip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip verify-airgap (registered in KNOWN_INCOMPLETE.md)
        run: |
          echo "::notice::SKIP Phase B make verify-airgap — deferred pending Linux+Docker (see KNOWN_INCOMPLETE.md). Command when unblocked: make verify-airgap"
          test -f KNOWN_INCOMPLETE.md
          grep -q "make verify-airgap" KNOWN_INCOMPLETE.md

      - name: Skip live E2E §11.4 step 7 (registered in KNOWN_INCOMPLETE.md)
        run: |
          echo "::notice::SKIP Phase B live E2E (SELF_AGENT_SPEC_V1.md §11.4 step 7) — deferred pending Linux+Docker+Ollama (see KNOWN_INCOMPLETE.md)."
          grep -q "11.4" KNOWN_INCOMPLETE.md
