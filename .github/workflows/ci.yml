name: CI

on:
  push:
    branches: [main, "ship/**", "fix/**", "pr/**", "scratch/**"]
  pull_request:
    branches: [main]

jobs:
  phase-a:
    name: Phase A gates
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      PYTHONPATH: ${{ github.workspace }}
      DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          mkdir -p "$DATA_DIR/logs"

      - name: make detect
        run: make detect

      - name: make test-unit
        run: make test-unit

      - name: make test-integration
        run: make test-integration

      - name: make test-e2e
        run: make test-e2e

      - name: make mutation-gate
        run: make mutation-gate

      - name: make compile-domain + generated tests
        run: |
          make compile-domain
          python -m pytest tests/generated/ -v

  phase-b-registered-skip:
    name: Phase B registered skip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip verify-airgap (registered in KNOWN_INCOMPLETE.md)
        run: |
          echo "::notice::SKIP Phase B make verify-airgap — deferred pending Linux+Docker (see KNOWN_INCOMPLETE.md). Command when unblocked: make verify-airgap"
          test -f KNOWN_INCOMPLETE.md
          grep -q "make verify-airgap" KNOWN_INCOMPLETE.md

      - name: Skip live E2E §11.4 step 7 (registered in KNOWN_INCOMPLETE.md)
        run: |
          echo "::notice::SKIP Phase B live E2E (SELF_AGENT_SPEC_V1.md §11.4 step 7) — deferred pending Linux+Docker+Ollama (see KNOWN_INCOMPLETE.md)."
          grep -q "11.4" KNOWN_INCOMPLETE.md
